# ==========================================================
#  주식 신고가 / 정배열 스크리너 설정
# ==========================================================

# 스캔할 시장 (원하는 것만 켜세요)
#   한국: KOSPI, KOSDAQ
#   미국: SP500, NASDAQ, NYSE, AMEX
#     - SP500 : 미국 대형주 500개 (가볍고 빠름, 추천 시작점)
#     - NASDAQ: 나스닥 전체(약 3,900종목) — 나스닥100 포함
#     - NYSE  : 뉴욕증권거래소 전체(약 2,800종목) — 다우30 포함
#     - AMEX  : 아멕스(약 330종목)
#   ※ 다우존스(30)·나스닥100은 별도 리스트가 없지만, NYSE/NASDAQ를 켜면 그 안에 모두 포함됩니다.
#   ※ NASDAQ+NYSE 전체(약 6,700종목)는 첫 실행이 오래 걸립니다(캐시 후 빨라짐).
markets:
  - KOSPI
  - KOSDAQ
  - SP500
  # - NASDAQ     # 나스닥 전체 (나스닥100 포함)
  # - NYSE       # 뉴욕 전체 (다우30 포함)
  # - AMEX

# 신고가 판정 기간 (주 단위). 각 기간별로 "현재 고가가 과거 N주 최고가인지" 체크
high_periods_weeks: [4, 13, 26, 52]

# 정배열에 사용할 주봉 이동평균 기간 (주 단위). 긴 쪽이 뒤로.
#   조건: MA4 > MA13 > MA26 > MA52 (모두 내림차순이면 정배열)
ma_periods_weeks: [4, 13, 26, 52]

# 리포트에 포함 기준:
#   any_high   -> 4/13/26/52주 신고가 중 하나라도 충족하면 포함 (정배열은 컬럼으로만 표시)
#   any_signal -> 위 신고가 중 하나라도 충족하거나 정배열이면 포함
#   require_both -> 신고가(하나라도) AND 정배열 둘 다 충족해야 포함
include_mode: any_high

# 데이터 다운로드 기준일수 (주봉 52주 MA 계산을 위해 넉넉히 2년 치)
lookback_days: 760

# 최소 거래대금/유동성 필터 (0이면 끔). 최근 종가 * 거래량 평균이 이 값 미만이면 제외.
#   단위: 해당 통화 (KR=원, US=달러). 시장별로 다르므로 0 권장(끔) 또는 신중히.
min_avg_dollar_volume: 0

# 네트워크 / 성능
max_workers: 8          # 동시 다운로드 스레드 수
request_sleep: 0.0      # 각 요청 사이 대기(초). 레이트 리밋 발생 시 0.1~0.3으로
cache_dir: "cache"      # OHLCV 캐시 저장 폴더
output_dir: "output"    # HTML 리포트 저장 폴더

# 캐시 사용 여부. true면 당일 이미 받은 데이터는 재사용(증분 업데이트)
use_cache: true

# 웹서버 (python run.py 실행 시 localhost 서버로 리포트 제공)
port: 8000              # 서버 포트
auto_open: true         # 실행 시 브라우저 자동 열기

# 환율: 시가총액 정렬 시 원화를 달러로 환산해 공통 비교하기 위한 기준 (1달러 = N원)
usd_krw: 1400
