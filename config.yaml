# ==========================================================
#  주식 신고가 / 정배열 스크리너 설정
# ==========================================================

# 실적 생성기·원문·완성본은 Finance 내부에 보관합니다.
earnings:
  source_dir: earnings

# 수출입 통계: Finance 내부 DB를 사용합니다.
# API 키는 CUSTOMS_API_KEY 환경변수 또는 .env에 설정하세요.
customs:
  db_path: customs_workspace/trade.db
  months: 60

# 미국 수출입 통계(U.S. Census). API 키는 CENSUS_API_KEY 환경변수 또는 .env.
us_customs:
  db_path: us_customs_workspace/ustrade.db
  months: 60

# 일본 수출입 통계(재무성 e-Stat). appId는 ESTAT_APP_ID 환경변수 또는 .env.
jp_customs:
  db_path: jp_customs_workspace/jptrade.db
  years: 5

# 스캔할 시장 (원하는 것만 켜세요)
#   한국: KOSPI, KOSDAQ
#   미국: NASDAQ, NYSE
#     - NASDAQ: 나스닥 전체(약 3,900종목) — 나스닥100 포함
#     - NYSE  : 뉴욕증권거래소 전체(약 2,800종목) — 다우30 포함
#   ※ 다우존스(30)·나스닥100은 별도 리스트가 없지만, NYSE/NASDAQ를 켜면 그 안에 모두 포함됩니다.
#   ※ 미국 전체(NASDAQ+NYSE 약 6,700종목)는 첫 실행이 오래 걸립니다(캐시 후 빨라짐).
markets:
  - KOSPI
  - KOSDAQ
  - NASDAQ
  - NYSE
  # 일본 도쿄증권거래소(약 3,900종목)를 포함하려면 아래 주석을 해제하세요.
  # 종목이 크게 늘어 첫 스캔이 더 오래 걸립니다(캐시 후 빨라짐).
  # - TSE

# 신고가 판정 기간 (주 단위). 각 기간별로 "현재 고가가 과거 N주 최고가인지" 체크
high_periods_weeks: [4, 13, 26, 52]

# 정배열에 사용할 주봉 이동평균 기간 (주 단위). 긴 쪽이 뒤로.
#   조건: MA4 > MA13 > MA26 > MA52 (모두 내림차순이면 정배열)
ma_periods_weeks: [4, 13, 26, 52]

# 리포트에 포함 기준:
#   any_high   -> 4/13/26/52주 신고가 중 하나라도 충족하면 포함 (정배열은 컬럼으로만 표시)
#   any_signal -> 위 신고가 중 하나라도 충족하거나 정배열이면 포함
#   require_both -> 신고가(하나라도) AND 정배열 둘 다 충족해야 포함
include_mode: any_high

# 데이터 다운로드 기준일수 (주봉 52주 MA 계산을 위해 넉넉히 2년 치)
lookback_days: 760

# 최소 거래대금/유동성 필터 (0이면 끔). 최근 종가 * 거래량 평균이 이 값 미만이면 제외.
#   단위: 해당 통화 (KR=원, US=달러). 시장별로 다르므로 0 권장(끔) 또는 신중히.
min_avg_dollar_volume: 0

# 네트워크 / 성능
max_workers: 8          # 동시 다운로드 스레드 수
request_sleep: 0.0      # 각 요청 사이 대기(초). 레이트 리밋 발생 시 0.1~0.3으로
cache_dir: "cache"      # OHLCV 캐시 저장 폴더
output_dir: "output"    # HTML 리포트 저장 폴더

# 캐시 사용 여부. true면 당일 이미 받은 데이터는 재사용(증분 업데이트)
use_cache: true

# 특수증권 제외: true면 우선주/유닛(SPAC)/권리/워런트 등 보통주가 아닌 종목을 제외.
#   (이런 종목은 시세 조회가 안 돼 대량 '실패'를 유발하므로 제외 권장)
exclude_special: true

# 웹서버 (python run.py 실행 시 localhost 서버로 리포트 제공)
port: 8000              # 서버 포트
auto_open: true         # 실행 시 브라우저 자동 열기

# 환율: 시가총액 정렬 시 원화를 달러로 환산해 공통 비교하기 위한 기준 (1달러 = N원)
usd_krw: 1400

# 환율: 일본(TSE) 시가총액을 달러로 환산해 공통 비교하기 위한 기준 (1달러 = N엔)
usd_jpy: 150

# ==========================================================
#  주간 시장 Recap (/recap 페이지)
# ==========================================================
# 서버 실행 후 http://localhost:8000/recap 에서 [업데이트] 클릭 시
#   1) FDR로 주요 지수 데이터 수집(현재가, 1W/1M/3M/YTD, 52주 고점 대비)
#   2) 아래 commentary_cmd 로 코멘터리(Editor's Comment) 생성
#   3) recap_cache.json 에 저장 후 화면 갱신
recap:
  # 코멘터리 생성에 사용할 CLI 명령 (LLM API 비용 0, 구독 CLI 활용).
  #   - 프롬프트는 항상 '표준입력(stdin)'으로 전달된다. (긴 프롬프트가 Windows의
  #     powershell -File 인자 전달에서 유실되는 문제를 피하기 위함)
  #   - "{prompt}" 자리표시자는 '-'(=stdin에서 읽기) 로 자동 치환된다.
  #     codex는 'codex exec ... -' 형태로 stdin 프롬프트를 읽는다.
  #   예) codex:  "codex exec --skip-git-repo-check --sandbox read-only {prompt}"
  #       claude: "claude -p"   (claude는 stdin 입력도 지원)
  #
  #   ※ Astra/high로 분야별 3종 + 전체 데이터 종합 1종, 총 4종 생성.
  #   ※ codex 플래그 설명:
  #     --model gpt-6-astra    : 코멘터리 모델을 Astra로 지정
  #     -c model_reasoning_effort=high : 해석 작업에 사용할 추론 수준
  #     --skip-git-repo-check : git 저장소 밖에서도 실행 허용 (없으면 'Not inside a
  #                             trusted directory' 에러로 코멘터리가 비어서 나옴)
  #     --sandbox read-only   : 모델이 임의 셸 명령을 실행하지 않도록 읽기전용 (안전)
  #     --color never         : 터미널 색상 escape 코드 제거 (출력 깔끔)
  commentary_cmd: "codex exec --model gpt-6-astra -c model_reasoning_effort=high --skip-git-repo-check --sandbox read-only --color never {prompt}"
  commentary_timeout: 300      # 초. 각 코멘터리 CLI 응답 대기 한도 (총 4회)
  commentary_enabled: true     # false면 지수 표만 생성(코멘터리 skip)
  lookback_days: 400           # 52주 비교/YTD 위해 1년+ 확보

  # 표시할 지수 목록 (group=행 그룹, name=표시명, symbol=FDR 티커)
  #   '^' 접두사(Yahoo 소스)가 최신값 안정적 — 검증됨
  #   상해종합(SSEC)은 '^' 없는 FDR 네이티브 심볼 사용
  #   글로벌 주식시장 시총 상위 시장을 지역별로 수록
  indices:
    - { group: "한국",   name: "코스피",            symbol: "^KS11" }
    - { group: "한국",   name: "코스닥",            symbol: "^KQ11" }
    - { group: "미국",   name: "S&P500",           symbol: "^GSPC" }
    - { group: "미국",   name: "나스닥",            symbol: "^IXIC" }
    - { group: "미국",   name: "다우",              symbol: "^DJI" }
    - { group: "미국",   name: "러셀2000",          symbol: "^RUT" }
    - { group: "미국",   name: "필라델피아반도체",   symbol: "^SOX" }
    - { group: "일본",   name: "니케이225",         symbol: "^N225" }
    - { group: "중화권", name: "대만가권",          symbol: "^TWII" }
    - { group: "중화권", name: "상해종합",          symbol: "SSEC" }
    - { group: "중화권", name: "홍콩 항셍",         symbol: "^HSI" }
    - { group: "인도",   name: "센섹스",            symbol: "^BSESN" }
    - { group: "인도",   name: "니프티50",          symbol: "^NSEI" }
    - { group: "유럽",   name: "유로스톡스50",      symbol: "^STOXX50E" }
    - { group: "유럽",   name: "독일 DAX",          symbol: "^GDAXI" }
    - { group: "유럽",   name: "영국 FTSE100",      symbol: "^FTSE" }
    - { group: "유럽",   name: "프랑스 CAC40",      symbol: "^FCHI" }
    - { group: "북미",   name: "캐나다 TSX",        symbol: "^GSPTSE" }

  # 1-2. 주요 원자재 — Yahoo 선물 심볼('=F'). 시세는 업데이트 시 수집.
  commodities:
    - { group: "귀금속", name: "금", symbol: "GC=F" }
    - { group: "귀금속", name: "은", symbol: "SI=F" }
    - { group: "귀금속", name: "플래티넘", symbol: "PL=F" }
    - { group: "귀금속", name: "팔라듐", symbol: "PA=F" }
    - { group: "산업금속", name: "구리", symbol: "HG=F" }
    - { group: "에너지", name: "WTI 원유", symbol: "CL=F" }
    - { group: "에너지", name: "브렌트유", symbol: "BZ=F" }
    - { group: "에너지", name: "천연가스", symbol: "NG=F" }
    - { group: "에너지", name: "휘발유", symbol: "RB=F" }
    - { group: "에너지", name: "난방유", symbol: "HO=F" }
    - { group: "농산물", name: "옥수수", symbol: "ZC=F" }
    - { group: "농산물", name: "밀", symbol: "ZW=F" }
    - { group: "농산물", name: "대두", symbol: "ZS=F" }
    - { group: "농산물", name: "대두유", symbol: "ZL=F" }
    - { group: "농산물", name: "커피", symbol: "KC=F" }
    - { group: "농산물", name: "코코아", symbol: "CC=F" }
    - { group: "농산물", name: "설탕", symbol: "SB=F" }
    - { group: "농산물", name: "면화", symbol: "CT=F" }

  # 1-3. 국채 금리 (네이버 금융 공개 API, 일별, 키 불필요). 등락은 bp.
  #   code = Reuters RIC (예: US10YT=RR). 국가별 2년물/10년물.
  #   공급자가 반환하지 않는 항목은 조회 실패로 표시 (다른 만기로 대체하지 않음).
  rates:
    - { group: "미국", name: "미국 2년", code: "US2YT=RR" }
    - { group: "미국", name: "미국 10년", code: "US10YT=RR" }
    - { group: "한국", name: "한국 2년", code: "KR2YT=RR" }
    - { group: "한국", name: "한국 10년", code: "KR10YT=RR" }
    - { group: "독일", name: "독일 2년", code: "DE2YT=RR" }
    - { group: "독일", name: "독일 10년", code: "DE10YT=RR" }
    - { group: "영국", name: "영국 2년", code: "GB2YT=RR" }
    - { group: "영국", name: "영국 10년", code: "GB10YT=RR" }
    - { group: "프랑스", name: "프랑스 2년", code: "FR2YT=RR" }
    - { group: "프랑스", name: "프랑스 10년", code: "FR10YT=RR" }
    - { group: "일본", name: "일본 2년", code: "JP2YT=RR" }
    - { group: "일본", name: "일본 10년", code: "JP10YT=RR" }
    - { group: "중국", name: "중국 2년", code: "CN2YT=RR" }
    - { group: "중국", name: "중국 10년", code: "CN10YT=RR" }

  # 1-3. 환율 (네이버 금융 공개 API). 등락은 %.
  fx:
    - { group: "지수",   name: "달러인덱스",   code: ".DXY" }
    - { group: "원화",   name: "원/달러",     code: "FX_USDKRW" }
    - { group: "원화",   name: "원/엔(100)",  code: "FX_JPYKRW" }
    - { group: "원화",   name: "원/유로",     code: "FX_EURKRW" }
    - { group: "원화",   name: "원/위안",     code: "FX_CNYKRW" }
