# ==========================================================
#  주식 신고가 / 정배열 스크리너 설정
# ==========================================================

# 스캔할 시장 (원하는 것만 켜세요)
#   한국: KOSPI, KOSDAQ
#   미국: NASDAQ, NYSE
#     - NASDAQ: 나스닥 전체(약 3,900종목) — 나스닥100 포함
#     - NYSE  : 뉴욕증권거래소 전체(약 2,800종목) — 다우30 포함
#   ※ 다우존스(30)·나스닥100은 별도 리스트가 없지만, NYSE/NASDAQ를 켜면 그 안에 모두 포함됩니다.
#   ※ 미국 전체(NASDAQ+NYSE 약 6,700종목)는 첫 실행이 오래 걸립니다(캐시 후 빨라짐).
markets:
  - KOSPI
  - KOSDAQ
  - NASDAQ
  - NYSE

# 신고가 판정 기간 (주 단위). 각 기간별로 "현재 고가가 과거 N주 최고가인지" 체크
high_periods_weeks: [4, 13, 26, 52]

# 정배열에 사용할 주봉 이동평균 기간 (주 단위). 긴 쪽이 뒤로.
#   조건: MA4 > MA13 > MA26 > MA52 (모두 내림차순이면 정배열)
ma_periods_weeks: [4, 13, 26, 52]

# 리포트에 포함 기준:
#   any_high   -> 4/13/26/52주 신고가 중 하나라도 충족하면 포함 (정배열은 컬럼으로만 표시)
#   any_signal -> 위 신고가 중 하나라도 충족하거나 정배열이면 포함
#   require_both -> 신고가(하나라도) AND 정배열 둘 다 충족해야 포함
include_mode: any_high

# 데이터 다운로드 기준일수 (주봉 52주 MA 계산을 위해 넉넉히 2년 치)
lookback_days: 760

# 최소 거래대금/유동성 필터 (0이면 끔). 최근 종가 * 거래량 평균이 이 값 미만이면 제외.
#   단위: 해당 통화 (KR=원, US=달러). 시장별로 다르므로 0 권장(끔) 또는 신중히.
min_avg_dollar_volume: 0

# 네트워크 / 성능
max_workers: 8          # 동시 다운로드 스레드 수
request_sleep: 0.0      # 각 요청 사이 대기(초). 레이트 리밋 발생 시 0.1~0.3으로
cache_dir: "cache"      # OHLCV 캐시 저장 폴더
output_dir: "output"    # HTML 리포트 저장 폴더

# 캐시 사용 여부. true면 당일 이미 받은 데이터는 재사용(증분 업데이트)
use_cache: true

# 특수증권 제외: true면 우선주/유닛(SPAC)/권리/워런트 등 보통주가 아닌 종목을 제외.
#   (이런 종목은 시세 조회가 안 돼 대량 '실패'를 유발하므로 제외 권장)
exclude_special: true

# 웹서버 (python run.py 실행 시 localhost 서버로 리포트 제공)
port: 8000              # 서버 포트
auto_open: true         # 실행 시 브라우저 자동 열기

# 환율: 시가총액 정렬 시 원화를 달러로 환산해 공통 비교하기 위한 기준 (1달러 = N원)
usd_krw: 1400

# ==========================================================
#  주간 시장 Recap (/recap 페이지)
# ==========================================================
# 서버 실행 후 http://localhost:8000/recap 에서 [업데이트] 클릭 시
#   1) FDR로 주요 지수 데이터 수집(현재가, 1W/1M/3M/YTD, 52주 고점 대비)
#   2) 아래 commentary_cmd 로 코멘터리(Editor's Comment) 생성
#   3) recap_cache.json 에 저장 후 화면 갱신
recap:
  # 코멘터리 생성에 사용할 CLI 명령 (LLM API 비용 0, 구독 CLI 활용).
  #   - "{prompt}" 자리표시자가 있으면 그 자리에 프롬프트가 인자로 들어감
  #   - 자리표시자가 없으면 프롬프트를 표준입력(stdin)으로 전달
  #   예) codex:  "codex exec --skip-git-repo-check --sandbox read-only {prompt}"
  #       claude: "claude -p {prompt}"
  #
  #   ※ codex 플래그 설명:
  #     --skip-git-repo-check : git 저장소 밖에서도 실행 허용 (없으면 'Not inside a
  #                             trusted directory' 에러로 코멘터리가 비어서 나옴)
  #     --sandbox read-only   : 모델이 임의 셸 명령을 실행하지 않도록 읽기전용 (안전)
  #     --color never         : 터미널 색상 escape 코드 제거 (출력 깔끔)
  commentary_cmd: "codex exec --skip-git-repo-check --sandbox read-only --color never {prompt}"
  commentary_timeout: 180      # 초. CLI 응답 대기 한도
  commentary_enabled: true     # false면 지수 표만 생성(코멘터리 skip)
  lookback_days: 400           # 52주 비교/YTD 위해 1년+ 확보

  # 표시할 지수 목록 (group=행 그룹, name=표시명, symbol=FDR 티커)
  #   '^' 접두사(Yahoo 소스)가 최신값 안정적 — 검증됨
  indices:
    - { group: "한국",   name: "코스피",            symbol: "^KS11" }
    - { group: "한국",   name: "코스닥",            symbol: "^KQ11" }
    - { group: "미국",   name: "S&P500",           symbol: "^GSPC" }
    - { group: "미국",   name: "나스닥",            symbol: "^IXIC" }
    - { group: "미국",   name: "다우",              symbol: "^DJI" }
    - { group: "미국",   name: "러셀2000",          symbol: "^RUT" }
    - { group: "미국",   name: "필라델피아반도체",   symbol: "^SOX" }
    - { group: "아시아", name: "니케이225",         symbol: "^N225" }
    - { group: "아시아", name: "대만가권",          symbol: "^TWII" }
